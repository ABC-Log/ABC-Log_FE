<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>역량 정리 | CareerLog</title>
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="../css/competency.css" />
    <script src="../js/common.js" defer></script>
    <script src="../js/competency.js" defer></script>
  </head>
  <body>
    <div id="site-header"></div>
    <main id="main">
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">MY STRENGTHS</p>
          <h1>역량 정리</h1>
          <p>
            여러 경험에 흩어진 강점을 한곳에 모아 보세요. 같은 역량이 반복된다면
            나만의 장점일 수 있어요.
          </p>
        </div>
      </section>
      <section class="content-section wrap">
        <div class="section-title">
          <h2>내가 쌓은 역량</h2>
          <p>경험 기록의 ‘사용한 역량’을 바탕으로 보여줍니다.</p>
        </div>
        <div id="skill-summary" class="skill-grid"></div>
        <div class="notice">
          역량을 더 찾고 싶다면, 경험 기록에서 맡은 일과 사용한 역량을
          구체적으로 적어 보세요.
        </div>
        <h2>역량과 연결된 경험</h2>
        <div id="skill-experiences" class="experience-grid"></div>
      </section>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
