<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | ABCLog</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/auth.css">
  <script src="../js/common.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main id="main" class="auth-main">
    <section class="panel auth-panel" aria-labelledby="login-title">
      <p class="eyebrow">WELCOME BACK</p>
      <h1 id="login-title">로그인</h1>
      <p class="muted">ABCLog에 로그인하고 나의 경험을 이어서 기록하세요.</p>
      <form id="login-form">
        <div class="field"><label for="login-email">이메일</label><input id="login-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div>
        <div class="field"><label for="login-password">비밀번호</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="button primary auth-submit" type="submit">로그인</button>
        <p class="status" id="auth-status" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-divider">아직 계정이 없나요? <a class="text-link" href="signup.html">회원가입</a></p>
      <p class="auth-note">현재는 화면 준비 단계입니다. 인증 API가 연결되면 로그인할 수 있습니다.</p>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
