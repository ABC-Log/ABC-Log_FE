<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | CareerLog</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/auth.css">
  <script src="../js/common.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main id="main" class="auth-main">
    <section class="panel auth-panel" aria-labelledby="signup-title">
      <p class="eyebrow">START WITH CAREERLOG</p>
      <h1 id="signup-title">회원가입</h1>
      <p class="muted">계정을 만들고 아르바이트 경험을 경력으로 정리해 보세요.</p>
      <form id="signup-form">
        <div class="field"><label for="signup-name">이름 또는 별명</label><input id="signup-name" name="name" type="text" maxlength="30" autocomplete="name" placeholder="예: 민지" required></div>
        <div class="field"><label for="signup-email">이메일</label><input id="signup-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div>
        <div class="field"><label for="signup-password">비밀번호</label><input id="signup-password" name="password" type="password" minlength="8" autocomplete="new-password" aria-describedby="password-hint" required><span class="hint" id="password-hint">8자 이상 입력해 주세요.</span></div>
        <div class="field"><label for="signup-password-confirm">비밀번호 확인</label><input id="signup-password-confirm" name="passwordConfirm" type="password" minlength="8" autocomplete="new-password" required></div>
        <button class="button primary auth-submit" type="submit">회원가입</button>
        <p class="status" id="auth-status" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-divider">이미 계정이 있나요? <a class="text-link" href="login.html">로그인</a></p>
      <p class="auth-note">현재는 화면 준비 단계입니다. 인증 API가 연결되면 회원가입할 수 있습니다.</p>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
